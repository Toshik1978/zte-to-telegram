[project]
name = "zte-to-telegram"
version = "1.0.0"
description = "Forward incoming SMS from a ZTE MC888 modem to a Telegram chat"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "click==8.5.0",
    "requests==2.34.2",
    "jsonpath-ng==1.8.0",
    "pygsm7==1.0.6",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.3",
    "pycryptodome==3.23.0",
]

[project.scripts]
zte-to-telegram = "cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: the project is a set of top-level modules and packages
# rather than a single package matching the project name.
only-include = ["cli.py", "forwarder.py", "zte", "sms", "telegram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["cli", "forwarder", "zte", "sms", "telegram"]
omit = ["tests/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
